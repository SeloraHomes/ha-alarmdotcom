name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catch breakage from new Home Assistant, HACS and dependency releases.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run the lefthook pre-commit jobs on every file
        run: lefthook run pre-commit --all-files --no-auto-install

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pytest tests/

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the PR title is a Conventional Commit
        # PRs are squash-merged, so the title becomes the commit on main that
        # the release notes are built from.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_commit_msg.py --title "$TITLE"
